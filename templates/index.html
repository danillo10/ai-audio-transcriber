<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcrição de Áudio | IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-4xl">
        <h1 class="text-3xl font-bold text-center text-indigo-400">🎙️ Transcrição de Áudio</h1>
        <p class="text-gray-300 text-center mt-2">Faça upload do seu áudio e veja a transcrição ao lado</p>

        <!-- Upload de Arquivo -->
        <div class="mt-6">
            <label for="audioFile" class="block text-lg font-semibold text-gray-200 mb-2">Selecione um áudio:</label>
            <input type="file" id="audioFile" accept=".mp3,.wav,.ogg,.opus"
                class="w-full p-2 border border-gray-600 rounded-lg bg-gray-700 text-gray-300">
        </div>

        <!-- Botão de Upload -->
        <button onclick="uploadFile()" 
            class="mt-4 w-full bg-indigo-500 hover:bg-indigo-600 transition duration-300 text-white font-semibold py-2 px-4 rounded-lg">
            📤 Enviar e Transcrever
        </button>

        <!-- Seção Flexível com Áudio e Transcrição Lado a Lado -->
        <div class="mt-6 flex flex-col md:flex-row gap-6">
            
            <!-- Player de Áudio -->
            <div class="md:w-1/2">
                <h2 class="text-lg font-semibold text-gray-200">🔊 Áudio:</h2>
                <audio id="audioPlayer" controls class="w-full mt-2 hidden bg-gray-700 rounded-lg"></audio>
            </div>

            <!-- Transcrição -->
            <div class="md:w-1/2">
                <h2 class="text-lg font-semibold text-gray-200">📝 Transcrição:</h2>
                <div id="result" class="mt-2 p-4 bg-gray-700 rounded-lg text-gray-300 h-48 overflow-y-auto">
                    Aguardando transcrição...
                </div>
            </div>
        </div>
    </div>

    <script>
        function uploadFile() {
            let fileInput = document.getElementById("audioFile");
            let file = fileInput.files[0];

            if (!file) {
                alert("Por favor, selecione um arquivo de áudio.");
                return;
            }

            let formData = new FormData();
            formData.append("audio", file);

            let audioURL = URL.createObjectURL(file);
            let audioPlayer = document.getElementById("audioPlayer");
            audioPlayer.src = audioURL;
            audioPlayer.classList.remove("hidden");

            fetch("/transcribe", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.transcription) {
                    document.getElementById("result").innerText = data.transcription;
                } else {
                    document.getElementById("result").innerText = "Erro ao transcrever o áudio.";
                }
            })
            .catch(error => {
                console.error("Erro:", error);
                document.getElementById("result").innerText = "Erro ao enviar o arquivo.";
            });
        }
    </script>
</body>
</html>
